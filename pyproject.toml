[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentrashield-native-optimized"
version = "0.2.0"
description = "Windows-native AI fraud detection starter"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentrashield_native*"]
